<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>それ、敬語にしときました。</title>
    <!-- Vue.jsをCDNから読み込み -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- BootStrapをCDNから読み込み -->
	<link rel="stylesheet" href="//cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background: #f8f7fc;
            color: #202040;
        }

        #app {
            padding-top: 30px;
            padding-bottom: 50px;
        }

        /* ===== ヘッダー ===== */
        .app-header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;

            min-height: 300px;
            padding: 50px 70px;
            margin-bottom: 35px;

            background: linear-gradient(
                135deg,
                #f5efff 0%,
                #ffffff 65%,
                #f0f5ff 100%
            );

            border-radius: 28px;
            box-shadow: 0 8px 30px rgba(80, 60, 140, 0.10);

            overflow: hidden;
        }

        /* 背景の飾り */
        .app-header::before {
            content: "";
            position: absolute;

            width: 260px;
            height: 260px;

            left: -100px;
            bottom: -130px;

            background: #eee5ff;
            border-radius: 50%;
            opacity: 0.7;
        }

        .app-header::after {
            content: "";
            position: absolute;

            width: 180px;
            height: 180px;

            right: -70px;
            top: -80px;

            background: #e8edff;
            border-radius: 50%;
            opacity: 0.7;
        }

        /* ===== タイトル ===== */
        .header-text {
            position: relative;
            z-index: 2;
            max-width: 650px;
        }

        .app-header h1 {
            margin: 0;

            font-size: 46px;
            font-weight: 700;
            letter-spacing: 1px;

            color: #25233d;
        }

        /* 「敬語」だけ紫 */
        .app-header h1 span {
            color: #7652e8;
        }

        .app-header p {
            margin: 18px 0 0;

            font-size: 20px;
            line-height: 1.8;

            color: #666681;
        }

        /* ===== イラスト ===== */
        .header-illustration {
            width: 520px;
            height: 300px;
        }

        .header-illustration img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* ===== スマートフォン ===== */
        @media (max-width: 768px) {

            .app-header {
                min-height: auto;

                padding: 35px 25px;

                flex-direction: column;
                align-items: flex-start;

                gap: 20px;
            }

            .app-header h1 {
                font-size: 32px;
                line-height: 1.4;
            }

            .app-header p {
                font-size: 16px;
                line-height: 1.7;
            }

            .header-illustration {
                width: 100%;
                max-width: 360px;
                height: 210px;

                margin: 0 auto;
            }
        }

        /* ===== 入力フォーム ===== */

        .input-card {
            background: #ffffff;
            padding: 35px;
            margin-bottom: 35px;

            border-radius: 24px;
            box-shadow: 0 6px 25px rgba(80, 60, 140, 0.08);
        }

        .input-card h2 {
            margin-top: 0;
            margin-bottom: 30px;

            font-size: 26px;
            color: #25233d;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;

            font-weight: 600;
            color: #34324a;
        }

        .form-select,
        .input-card textarea {
            border-radius: 12px;
            border: 1px solid #ddd8ef;
            padding: 12px 15px;

            font-size: 16px;
        }

        .form-select:focus,
        .input-card textarea:focus {
            border-color: #7652e8;
            box-shadow: 0 0 0 0.2rem rgba(118, 82, 232, 0.12);
        }

        /* 文章の雰囲気 */
        .tone-options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .tone-options label {
            display: flex;
            align-items: center;
            gap: 7px;

            padding: 11px 18px;

            border: 1px solid #ddd8ef;
            border-radius: 12px;

            cursor: pointer;
        }

        .tone-options input {
            accent-color: #7652e8;
        }

        /* 生成ボタン */
        .generate-button {
            width: 100%;

            border: none;
            border-radius: 14px;

            padding: 15px;

            font-size: 18px;
            font-weight: 600;

            color: white;
            background: linear-gradient(135deg, #7652e8, #6240d4);

            cursor: pointer;

            transition: transform 0.2s, box-shadow 0.2s;
        }

        .generate-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(118, 82, 232, 0.25);
        }

        /* スマホ */
        @media (max-width: 768px) {

            .input-card {
                padding: 25px 20px;
            }

            .tone-options {
                flex-direction: column;
            }

            .tone-options label {
                width: 100%;
            }
        }

        /* ===== 生成結果 ===== */

        .result-card {
            background: #ffffff;
            padding: 35px;
            margin-bottom: 35px;

            border-radius: 24px;
            box-shadow: 0 6px 25px rgba(80, 60, 140, 0.08);
        }

        .result-card h2 {
            margin-top: 0;
            margin-bottom: 30px;

            font-size: 26px;
            color: #25233d;
        }

        .result-group {
            margin-bottom: 25px;
        }

        .result-group label {
            display: block;
            margin-bottom: 8px;

            font-weight: 600;
            color: #34324a;
        }

        .result-row {
            display: flex;
            gap: 10px;
        }

        .result-row .form-control {
            flex: 1;
        }

        .result-card .form-control {
            border-radius: 12px;
            border: 1px solid #ddd8ef;
            padding: 12px 15px;
            font-size: 16px;
        }

        .result-card .form-control:focus {
            border-color: #7652e8;
            box-shadow: 0 0 0 0.2rem rgba(118, 82, 232, 0.12);
        }

        .copy-button {
            border: none;
            border-radius: 10px;

            padding: 0 18px;

            color: #7652e8;
            background: #f0ebff;

            font-weight: 600;
            cursor: pointer;

            white-space: nowrap;
        }

        .copy-button:hover {
            background: #e6ddff;
        }

        .body-copy-button {
            margin-top: 10px;
            padding: 9px 16px;
        }

        .regenerate-button {
            width: 100%;

            border: none;
            border-radius: 14px;

            padding: 14px;

            font-size: 17px;
            font-weight: 600;

            color: #7652e8;
            background: #f1edff;

            cursor: pointer;
        }

        .regenerate-button:hover {
            background: #e7e0ff;
        }

        .copy-message {
            margin: 15px 0 0;

            text-align: center;

            color: #7652e8;
            font-weight: 600;
        }

        /* スマホ */
        @media (max-width: 768px) {

            .result-card {
                padding: 25px 20px;
            }

            .result-row {
                flex-direction: column;
            }

            .copy-button {
                padding: 11px;
            }
        }

    </style>
</head>
<body>

    <div id="app" class="container">
        <div class="app-header">

            <div class="header-text">
                <h1>それ、<span>敬語</span>にしときました。</h1>
                <p>言いたいことだけ入れて。社会人にして返します。</p>
            </div>

            <div class="header-illustration">
                <img src="header-illustration.png"
                    alt="メール作成をイメージしたイラスト">
            </div>

        </div>

       <div class="input-card">

            <h2>✏️ 入力する</h2>

            <!-- あなたの立場 -->
            <div class="form-group">
                <label for="senderRole">あなたの立場</label>
                <input
                    id="senderRole"
                    type="text"
                    class="form-control"
                    placeholder="例：大学生、営業担当者など"
                >
            </div>

            <!-- 送信相手 -->
            <div class="form-group">
                <label for="recipient">送信相手</label>
                <input
                    id="recipient"
                    type="text"
                    class="form-control"
                    placeholder="例：インターンシップ先の人事担当者"
                >
            </div>

            <!-- メールの目的 -->
            <div class="form-group">
                <label for="purpose">メールの目的</label>
                <select id="purpose" class="form-select">
                    <option>インターンシップのお礼</option>
                    <option>日程調整</option>
                    <option>質問・問い合わせ</option>
                    <option>お詫び</option>
                    <option>その他</option>
                </select>
            </div>

            <!-- 伝えたい内容 -->
            <div class="form-group">
                <label for="inputText">伝えたい内容</label>
                <textarea
                    id="inputText"
                    class="form-control"
                    rows="6"
                    v-model="inputText"
                    placeholder="ここに伝えたい内容を入力してください..."
                ></textarea>
            </div>

            <!-- 文章の雰囲気 -->
            <div class="form-group">
                <label>文章の雰囲気</label>

                <div class="tone-options">
                    <label>
                        <input type="radio" name="tone" value="丁寧" checked>
                        丁寧
                    </label>

                    <label>
                        <input type="radio" name="tone" value="標準">
                        標準
                    </label>

                    <label>
                        <input type="radio" name="tone" value="やや柔らかい">
                        やや柔らかい
                    </label>
                </div>
            </div>

            <button @click="execute" class="generate-button">
                ✈️ メールを生成する
            </button>

        </div>
        
        <!-- ===== 生成結果 ===== -->
        <div class="result-card">

            <h2>✉️ 生成結果</h2>

            <!-- 件名 -->
            <div class="result-group">
                <label for="resultSubject">件名</label>

                <div class="result-row">
                    <input
                        id="resultSubject"
                        type="text"
                        class="form-control"
                        v-model="resultSubject"
                        placeholder="ここに件名が表示されます"
                    >

                    <button
                        @click="copySubject"
                        class="copy-button">
                        コピー
                    </button>
                </div>
            </div>

            <!-- 本文 -->
            <div class="result-group">
                <label for="resultBody">本文</label>

                <textarea
                    id="resultBody"
                    class="form-control"
                    rows="12"
                    v-model="resultBody"
                    placeholder="ここに生成されたメール本文が表示されます"
                ></textarea>

                <button
                    @click="copyBody"
                    class="copy-button body-copy-button">
                    本文をコピー
                </button>
            </div>

            <!-- 追加指示 -->
            <div class="result-group">
                <label for="additionalInstruction">追加指示</label>

                <input
                    id="additionalInstruction"
                    type="text"
                    class="form-control"
                    v-model="additionalInstruction"
                    placeholder="例：もう少し簡潔にしてください"
                >
            </div>

            <button
                @click="regenerate"
                class="regenerate-button">
                ↻ 再生成
            </button>

            <!-- コピー完了メッセージ -->
            <p v-if="copyMessage" class="copy-message">
                {{ copyMessage }}
            </p>

        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    inputText: '',

                    resultSubject: '',
                    resultBody: '',

                    additionalInstruction: '',

                    copyMessage: ''
                };
            },
            methods: {
                async sendRequest(context = null) {
                    this.resultText = '処理中...';
                    try {
                        const payload = { text: this.inputText };
                        if (context) {
                            payload.context = context;
                        }

                        const response = await fetch('/send_api', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify(payload)
                        });
                        const data = await response.json();
                        if (response.ok) {
                            this.resultText = data.processed_text;
                        } else {
                            this.resultText = `エラー: ${data.error || '不明なエラーが発生しました。'}`;
                        }
                    } catch (error) {
                        this.resultText = `エラー: ${error.message}`;
                    }
                },
                execute() {
                    this.sendRequest();
                },
                execute_kansai() {
                    this.sendRequest("あなたは親切な関西人です。ユーザーからの入力に対して、必ず関西弁で、親しみやすく、そして140字以内で回答してください。");
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
